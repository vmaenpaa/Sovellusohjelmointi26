services:
    db:
      image: postgres

      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}

      ports:
        - "5432:5432"

    backend:
      build: ./backend
      ports:
        - "${API_PORT}:8000"
      environment:
        DATABASE_URL: ${DATABASE_URL}
        API_HOST: ${API_HOST}
        API_PORT: ${API_PORT}
        CORS_ORIGINS: ${CORS_ORIGINS}